name: Weekly On-Call Brief

# Rebuilds data/intel/brief.json from the latest on-call (Thu), COT (Fri),
# WASDE (~12th), export sales (Thu) and Yahoo prices. Commits only on change.
on:
  schedule:
    - cron: '30 23 * * 1-6'
  workflow_run:
    workflows: ["Weekly Cotton On-Call Scrape"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: oncall-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests yfinance
      - run: python intel/weekly_brief.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intel
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "brief: weekly update $(date -u +'%Y-%m-%d')"
            git pull --rebase -q && git push
          fi
